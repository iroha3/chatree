# 发版：push 到 master 时，若 package.json 的版本还没打过 tag，就构建全平台产物并建 Release。
#
# 幂等：判断"要不要发版"只看 `v$VERSION` 这个 tag 存不存在。改版本号 = 一次普通提交，
# push 就发版；重跑不会重复发。
#
# 关于成本：这是**公开仓库**，GitHub 托管的 runner（含 macOS / Windows / arm64）都不计费，
# 所以三平台 × 双架构全出。私有仓库会按分钟计费，那时再砍。
#
# 产物：各平台安装包 + 原始可执行文件 + 网页版 dist.zip + GHCR 上的 Docker 镜像。
# 不做 GitHub Pages —— 网页版已经部署在 Cloudflare。
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 0. 版本与是否发版 ─────────────────────────────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "tag v$VERSION 已存在，跳过发版（幂等）"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "准备发布 v$VERSION"
          fi

  # ── 1. 网页版 dist.zip ───────────────────────────────────────
  web:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - name: Zip the web build
        run: |
          cd dist
          zip -r "../chatree-web-${{ needs.version.outputs.version }}.zip" .
      - uses: actions/upload-artifact@v5
        with:
          name: web
          path: chatree-web-*.zip
          if-no-files-found: error

  # ── 2. 桌面版：每个 runner 原生构建自己的架构（Pake 没有 --arch）──
  #
  # 第一版矩阵碰到的两个坑（已解决，别再改回去）：
  #
  #   * macos-13（Intel）**排队 19 分钟都拿不到机器** —— 这个 label 已经
  #     没人权了。改成 macos-14 + `--multi-arch` 出一个 x64+arm64 通用包，
  #     一次构建顶两个，也不用赌 Intel runner 什么时候被彻底下线。
  #     （代价：要自己 `rustup target add x86_64-apple-darwin`，Pake 不管这事。）
  #
  #   * `windows-11-arm` **必定失败**：Pake 3.17.1 在 Windows ARM64 上有个
  #     文件名 bug —— Tauri 产出 `Chatree_0.1.0_arm64_en-US.msi`，而 Pake 去找
  #     `Chatree_0.1.0_aarch64_en-US.msi`（ARCH_DISPLAY_NAMES.arm64 = 'aarch64'），
  #     于是 ENOENT → BUILD_FAILED，连 keepBinary 都来不及拷原始 exe。
  #     所以先不出 Windows ARM64；Windows on ARM 可以直接跑下面的 x64 包
  #     （系统自带 x64 模拟）。详见 docs/ROADMAP.md。
  desktop:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
          - os: macos-14
            platform: macos
            arch: universal
            extra: --multi-arch
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # collect-artifacts.mjs 靠这两个变量给产物起名，不然会跨平台重名覆盖
      CHATREE_PLATFORM: ${{ matrix.platform }}
      CHATREE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: bun install --frozen-lockfile
      - run: bun run build

      # --multi-arch 要两个目标都装上；GitHub 的 arm64 Mac 只带了宿主那个。
      - name: Add the other macOS Rust target
        if: matrix.platform == 'macos'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      # 打包。scripts/pake.mjs 会用 package.json 的版本 + 平台对应的图标，
      # 并把产物清单写进 pake-artifacts.json。
      - name: Build desktop app
        run: bun run desktop:build:ci ${{ matrix.extra }}

      - name: Collect artifacts
        run: bun scripts/collect-artifacts.mjs

      - uses: actions/upload-artifact@v5
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/**
          if-no-files-found: error

  # ── 3. 网页版的 Docker 镜像（内网自持用）────────────────────
  docker:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}

  # ── 4. 建 tag + Release，附上所有产物 ────────────────────────
  #
  # 注意 if 里用的是 !cancelled() 而不是 needs.desktop.result == 'success'：
  # 某一个平台的打包挂掉，不应该把已经成功的那几个平台也一起埋掉 ——
  # 发布“能出的那些”比什么都不发好，失败在 Actions 页面照样是红的。
  release:
    needs: [version, web, desktop, docker]
    if: ${{ !cancelled() && needs.version.outputs.release == 'true' && needs.web.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: List collected files
        run: find artifacts -type f -printf '%f\t%k KB\n' | sort
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Chatree v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/**
          fail_on_unmatched_files: true
